<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
	<!--
		The Roundel: the outermost ring of the wheel — twelve pitch classes in
		circle-of-fifths order, C at noon — with the transit bar across it. The two
		stations the bar meets (A and E-flat, on the horizontal) sit on top of it,
		each with a gap in the ground colour so a light one still reads.

		Hex values are the sRGB rendering of the default OKLCH palette in
		src/lib/design/palette.ts — an icon cannot read the database, so this is
		the one place the colours are duplicated. The bar ends stay inside the
		middle 80% so the mark survives a maskable crop.
	-->
	<rect width="512" height="512" fill="#0c0d11" />
	<g transform="translate(256 256)">
		<circle r="150" fill="none" stroke="#2a2d36" stroke-width="6" />
		<rect x="-190" y="-33" width="380" height="66" fill="#f3f4f7" />
		<g stroke="#0c0d11" stroke-width="9">
			<circle cx="0" cy="-150" r="30" fill="#f0574e" />
			<circle cx="75" cy="-129.9" r="30" fill="#168dd9" />
			<circle cx="129.9" cy="-75" r="30" fill="#fb9437" />
			<circle cx="150" cy="0" r="30" fill="#6e60d2" />
			<circle cx="129.9" cy="75" r="30" fill="#f2d350" />
			<circle cx="75" cy="129.9" r="30" fill="#bc55c4" />
			<circle cx="0" cy="150" r="30" fill="#00aeb0" />
			<circle cx="-75" cy="129.9" r="30" fill="#f8763c" />
			<circle cx="-129.9" cy="75" r="30" fill="#4d77db" />
			<circle cx="-150" cy="0" r="30" fill="#fab435" />
			<circle cx="-129.9" cy="-75" r="30" fill="#975ad1" />
			<circle cx="-75" cy="-129.9" r="30" fill="#58c66e" />
		</g>
	</g>
</svg>
