# Local development database only. Nothing here is deployed.
#
# This exists so a checkout can run `npm run db:migrate` and `npm run dev`
# against a real Postgres with one command, without an account anywhere. Any
# Postgres 15+ works just as well — point DATABASE_URL at it and skip this.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: harmonic
      POSTGRES_PASSWORD: harmonic
      POSTGRES_DB: harmonic
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U harmonic -d harmonic']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
