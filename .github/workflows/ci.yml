name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch: the newest push is the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run check

      - name: Tests
        run: npm test

      # No secrets needed: env vars are read at runtime through
      # $env/dynamic/private, so a build proves the app compiles without a
      # database anywhere near it.
      - name: Build
        run: npm run build
