name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch: the newest push is the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run check

      - name: Tests
        run: npm test

      # No secrets needed: env vars are read at runtime through
      # $env/dynamic/private, so a build proves the app compiles without a
      # database anywhere near it.
      - name: Build
        run: npm run build

  # A throwaway Postgres, never the one anyone practises on. src/lib/server/db/index.ts
  # refuses to read DATABASE_URL under Vitest at all, so this job's env only
  # ever points at the service container below.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harmonic
          POSTGRES_PASSWORD: harmonic
          POSTGRES_DB: harmonic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harmonic -d harmonic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://harmonic:harmonic@localhost:5432/harmonic
      TEST_DATABASE_URL: postgres://harmonic:harmonic@localhost:5432/harmonic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migrate the disposable database
        run: npm run db:migrate

      - name: Seed the curriculum
        run: npm run db:seed

      - name: Integration tests
        run: npm run test:integration
